name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite executar este workflow manualmente pela aba Actions do GitHub
  workflow_dispatch:

# Define as permissões do GITHUB_TOKEN para permitir o deploy direto para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy concorrente por vez para evitar condições de corrida
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile WebAssembly
        run: npm run build:wasm

      - name: Run Symmetrical Wavelet Integration Tests
        run: npm run test:integration

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
