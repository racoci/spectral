<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="spectralGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGlow)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <line x1="8" y1="44" x2="56" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Vertical Spectral Harmonics / Time-Frequency Bars -->
  <rect x="12" y="28" width="3" height="8" rx="1.5" fill="#10b981" opacity="0.6" />
  <rect x="18" y="22" width="3" height="20" rx="1.5" fill="#38bdf8" opacity="0.75" />
  <rect x="24" y="16" width="3" height="32" rx="1.5" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  <rect x="30" y="12" width="3" height="40" rx="1.5" fill="url(#spectralGrad)" filter="url(#glow)" />
  <rect x="36" y="18" width="3" height="28" rx="1.5" fill="#818cf8" opacity="0.9" filter="url(#glow)" />
  <rect x="42" y="24" width="3" height="16" rx="1.5" fill="#c084fc" opacity="0.8" />
  <rect x="48" y="29" width="3" height="6" rx="1.5" fill="#e879f9" opacity="0.6" />

  <!-- Reassigned Phase Wave Curves (Audio <-> Image Duality) -->
  <path d="M 8 36 C 18 36, 20 18, 30 18 C 40 18, 42 46, 56 32" fill="none" stroke="url(#spectralGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 8 32 C 16 32, 22 44, 32 44 C 42 44, 46 22, 56 22" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 2" />

  <!-- Glowing Ridge Peak Particles -->
  <circle cx="30" cy="18" r="2.2" fill="#ffffff" filter="url(#glow)" />
  <circle cx="42" cy="30" r="1.6" fill="#38bdf8" filter="url(#glow)" />
</svg>
